  :root {
    --ink:        #04122c;
    --ink-deep:   #030d20;
    --sea:        #0a2a63;
    --gold:       #fab040;
    --alert:      #e34554;
    --white:      #ffffff;
    --mist:       rgba(255,255,255,.46);
    --mist-soft:  rgba(255,255,255,.28);
    --paper:      #ffffff;
    --paper-ink:  #1c1c1c;
    --paper-blue: #2e6db4;
    --paper-navy: #232b6d;
    --paper-rule: #c9d4e4;
    --paper-soft: #f2f5fa;
    --font:       'Poppins', Arial, Helvetica, sans-serif;
    --pad:        clamp(20px, 4vw, 44px);
    --accent:     #00a9e8;
  }

  * { box-sizing: border-box; }
  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    font-family: var(--font);
    color: var(--white);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--sea) 0%, var(--ink) 55%, var(--ink-deep) 100%)
      no-repeat fixed;
    background-color: var(--ink-deep);
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  .logo {
    position: fixed;
    top: var(--pad);
    right: var(--pad);
    width: 140px;
    opacity: .4;
    z-index: 20;
  }

  /* ---------- views ---------- */

  .view { display: none; }
  .view.on { display: block; animation: rise .26s ease both; }
  body.booting .view { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- password ---------- */

  #gate.on {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: var(--pad);
  }

  .gate-mark { width: 300px; margin-bottom: 48px; }

  .entry { display: flex; gap: 12px; }

  #pw {
    width: min(360px, 58vw);
    height: 58px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
    color: var(--white);
    font: 400 15px var(--font);
    outline: none;
    transition: border-color .2s ease;
  }
  #pw::placeholder { color: rgba(255,255,255,.32); }
  #pw:focus { border-color: rgba(255,255,255,.5); }
  #gate.bad #pw { border-color: var(--alert); animation: nudge .3s ease; }

  @keyframes nudge {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  #go {
    height: 58px;
    padding: 0 30px;
    border: 0;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    font: 600 12px var(--font);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s ease;
  }
  #go:disabled { opacity: .45; cursor: default; }

  .note {
    min-height: 20px;
    margin: 18px 0 0;
    font-size: 12.5px;
    letter-spacing: .03em;
    color: var(--mist);
  }

  /* ---------- session ---------- */

  #session.on { padding: calc(var(--pad) + 66px) var(--pad) calc(var(--pad) + 40px); }

  .wrap { width: min(880px, 100%); margin: 0 auto; }

  .head { margin: 0 0 clamp(18px, 2.4vh, 28px); }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .title {
    margin: 0;
    font-size: clamp(21px, 2.7vw, 31px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.2;
  }

  .stage {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 22px 60px rgba(2, 10, 28, .55);
  }
  .stage iframe { display: block; width: 100%; height: 100%; border: 0; }

  .sheets {
    margin-top: clamp(34px, 5vw, 60px);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3vw, 32px);
  }

  /* ---------- action button ---------- */

  .allbox { margin: clamp(30px, 4vw, 48px) auto 0; }

  .act {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 22px 28px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: #04223a;
    font: 600 14px var(--font);
    letter-spacing: .04em;
    cursor: pointer;
    text-align: center;
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.32);
  }
  .act:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,0,0,.4); }
  .act:disabled { cursor: default; opacity: .4; box-shadow: none; }
  .act svg { flex: none; }

  .hint {
    margin: 12px 0 0;
    text-align: center;
    font-size: 12.5px;
    color: var(--mist);
  }

  /* ---------- workbook sheet ---------- */

  .sheet {
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 12px;
    padding: clamp(26px, 4vw, 44px) clamp(22px, 4vw, 48px) clamp(30px, 4vw, 48px);
    box-shadow: 0 16px 40px rgba(2, 10, 28, .42);
  }

  .sheet .tag {
    margin: 0 0 18px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .sheet .quote {
    margin: 0;
    font-size: clamp(15px, 1.9vw, 18px);
    font-style: italic;
    font-weight: 600;
    line-height: 1.45;
    color: #14181f;
  }

  .sheet .blocks {
    margin-top: clamp(24px, 3vw, 36px);
    display: flex;
    flex-direction: column;
    gap: clamp(24px, 3vw, 34px);
  }

  .blk h3 {
    margin: 0 0 14px;
    font-size: clamp(16px, 2vw, 19px);
    font-weight: 600;
    color: var(--paper-blue);
    line-height: 1.3;
  }

  .lines { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 12px; }
  .line span {
    flex: none;
    width: 26px;
    font-size: 15px;
    color: #7a8593;
    font-variant-numeric: tabular-nums;
  }

  input.f, textarea.f {
    width: 100%;
    font: 400 15px var(--font);
    color: var(--paper-ink);
    background: transparent;
    border: 0;
    outline: none;
  }
  input.f {
    border-bottom: 1.5px solid var(--paper-rule);
    padding: 7px 4px;
    transition: border-color .16s ease;
  }
  input.f:focus { border-bottom-color: var(--paper-blue); }
  input.f::placeholder, textarea.f::placeholder { color: #aab4c2; }

  textarea.f {
    resize: none;
    overflow: hidden;
    background: var(--paper-soft);
    border: 1px solid #dfe6f0;
    border-radius: 8px;
    padding: 14px 16px;
    line-height: 1.6;
    transition: border-color .16s ease;
  }
  textarea.f:focus { border-color: var(--paper-blue); }

  .callout {
    border: 5px solid var(--gold);
    border-radius: 6px;
    padding: 14px;
    background: var(--gold);
  }
  .callout h4 {
    margin: 0 0 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #14181f;
  }
  .callout .inner { background: #fff; border-radius: 3px; padding: 10px 12px; }
  .callout textarea.f { background: transparent; border: 0; padding: 4px; }

  .notebox {
    border: 5px solid var(--gold);
    border-radius: 6px;
    background: var(--gold);
    padding: 6px;
  }
  .notebox p {
    margin: 0;
    background: #fff;
    border-radius: 3px;
    padding: 14px 18px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
  }

  .inline-q { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .inline-q h3 { margin: 0; }
  .inline-q input.f { width: auto; flex: 1 1 220px; min-width: 200px; }

  /* ---------- labelled rows (the deck's blue-header tables) ---------- */

  .grid { border: 1px solid #e3e9f2; border-radius: 8px; overflow: hidden; }
  .grid .hdr {
    display: flex;
    background: var(--paper-navy);
    color: #fff;
  }
  .grid .hdr div {
    padding: 11px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .grid .row { display: flex; border-top: 1px solid #e9eef6; }
  .grid .row:first-of-type { border-top: 0; }
  .grid .row > .lab {
    flex: none;
    width: 34%;
    padding: 13px 16px;
    background: #f4f6fa;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #333a45;
    display: flex;
    align-items: center;
  }
  .grid .row > .cell { flex: 1; padding: 8px 14px; display: flex; align-items: center; }
  .grid .row > .cell input.f { border-bottom: 0; }
  .grid .row > .cell textarea.f { background: #fff; border: 0; padding: 8px 2px; min-height: 0; }
  .grid .hdr .lab { flex: none; width: 34%; }
  .grid .hdr .cell { flex: 1; }

  /* worksheet: person / focus / hat */
  .wsheet .hdr .c1, .wsheet .row .c1 { flex: none; width: 46px; }
  .wsheet .hdr .c2, .wsheet .row .c2 { flex: 2; }
  .wsheet .hdr .c3, .wsheet .row .c3 { flex: 1.3; }
  .wsheet .hdr .c4, .wsheet .row .c4 { flex: 1.5; }
  .wsheet .row > div { padding: 8px 12px; display: flex; align-items: center; border-left: 1px solid #eef2f8; }
  .wsheet .row > .c1 {
    border-left: 0;
    background: #f4f6fa;
    color: #7a8593;
    font-size: 14px;
    justify-content: center;
  }
  .wsheet .hdr > div { border-left: 1px solid rgba(255,255,255,.14); }
  .wsheet .hdr > .c1 { border-left: 0; }
  .wsheet input.f { border-bottom: 0; padding: 6px 2px; }

  /* ---------- figures ---------- */

  .fig { position: relative; width: 100%; margin: 0 auto; }
  .fig svg { display: block; width: 100%; height: auto; }
  .fig .ov { position: absolute; }
  .fig .ov input.f {
    font-size: 14px;
    text-align: center;
    background: rgba(255,255,255,.94);
    border-bottom-color: var(--paper-blue);
    border-radius: 4px 4px 0 0;
  }

  .hats { display: flex; gap: 10px; }
  .hats div {
    flex: 1;
    background: var(--paper-navy);
    color: #fff;
    border-radius: 4px;
    padding: 30px 6px;
    text-align: center;
    font-size: clamp(13px, 1.7vw, 17px);
    font-weight: 500;
  }

  @media (max-width: 620px) {
    .logo { width: 116px; }
    .entry { flex-direction: column; align-items: stretch; width: min(320px, 78vw); }
    #pw { width: 100%; }
    .grid .row { flex-direction: column; }
    .grid .row > .lab { width: 100%; }
    .grid .hdr { display: none; }
    .wsheet .row { flex-direction: column; align-items: stretch; }
    .wsheet .row > div { width: 100%; border-left: 0; border-top: 1px solid #eef2f8; }
    .wsheet .row > .c1 { justify-content: flex-start; border-top: 0; }
    .hats { flex-wrap: wrap; }
    .hats div { flex: 1 1 44%; padding: 18px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- print sheets (used for the PDF only) ---------- */

  #printroot { position: fixed; left: -20000px; top: 0; width: 816px; background: #fff; }
  .psheet {
    width: 816px;
    background: #fff;
    color: #1c1c1c;
    padding: 56px 64px 64px;
    font-family: var(--font);
  }
  .psheet .pmark { width: 190px; aspect-ratio: 520/61; margin-bottom: 30px; }
  .psheet .pq { margin: 0; font: italic 600 17px var(--font); line-height: 1.45; }
  .psheet h3 { margin: 30px 0 12px; font-size: 18px; font-weight: 600; color: #2e6db4; }
  .psheet .pline { display: flex; gap: 10px; align-items: baseline; margin: 0 0 12px; }
  .psheet .pline b { flex: none; width: 24px; font-weight: 400; color: #7a8593; font-size: 14px; }
  .psheet .pline u {
    flex: 1; text-decoration: none; border-bottom: 1.5px solid #c9d4e4;
    padding-bottom: 4px; font-size: 14px; min-height: 22px; display: block;
  }
  .psheet .ptext {
    border: 1px solid #dfe6f0; background: #f7f9fc; border-radius: 6px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    min-height: 54px;
  }
  .psheet .pfoot { margin-top: 34px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #9aa2ab; }
  .psheet .pcall { border: 5px solid #fab040; background: #fab040; border-radius: 6px; padding: 6px; }
  .psheet .pcall h4 { margin: 0 0 6px; text-align: center; font-size: 14px; }
  .psheet .pcall .pin { background: #fff; border-radius: 3px; padding: 10px 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; min-height: 54px; }
  .psheet .pfig { width: 100%; }
  .psheet .pfig svg { width: 100%; height: auto; display: block; }
  .psheet table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .psheet table th {
    background: #232b6d; color: #fff; text-align: left; padding: 9px 12px;
    font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  }
  .psheet table td { border: 1px solid #e3e9f2; padding: 10px 12px; vertical-align: top; }
  .psheet table td.lab {
    background: #f4f6fa; color: #333a45; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase; width: 34%;
  }
  .psheet table td.num { background: #f4f6fa; color: #7a8593; width: 34px; text-align: center; }
  .psheet .phats { display: flex; gap: 8px; }
  .psheet .phats div {
    flex: 1; background: #232b6d; color: #fff; border-radius: 4px;
    padding: 26px 4px; text-align: center; font-size: 15px;
  }
</style>

        { t:"prompt", k:"know", label:"What I actually know about my people — goals, motivations, fears:", rows:4 }
      ]},

    { id:"p13", pg:"Pg. 13", foot:"Shifting Gears",
      quote:"Shifting gears is the key.",
      blocks:[
        { t:"num", k:"rules", label:"Five rules for shifting gears:", n:5 },
        { t:"prompt", k:"avoid", label:"The conversation I have been avoiding, and the hat it needs:", rows:4 }
      ]},

    { id:"p14", pg:"Pg. 14", foot:"To Do Within 30 Days",
      quote:"Clarity brings energy, energy brings momentum, and momentum brings results.",
      blocks:[
        { t:"wsheet", k:"todo", n:7 }
      ]},

    { id:"p15", pg:"Pg. 15", foot:"Lessons Learned",
      quote:"I'll know who you are by your behavior.",
      blocks:[
        { t:"prompt", k:"lesson", label:"My biggest lesson learned was:", rows:6 },
        { t:"prompt", k:"use", label:"How I will use it in real life:", rows:6 }
      ]}
  ];

  const WS_COLS = ["Person", "Focus on (B, A or T?)", "Leadership hat"];
  const TRI_FIELDS = [["top", "Top"], ["left", "Bottom left"], ["right", "Bottom right"]];

  /* ---------- tiny helpers ---------- */

  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  };

  let ANSWERS = {};
  function loadAnswers() {
    try { ANSWERS = JSON.parse(localStorage.getItem(WB) || "{}") || {}; }
    catch (e) { ANSWERS = {}; }
  }
  let saveTimer = null;
  function saveAnswers() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(WB, JSON.stringify(ANSWERS)); } catch (e) {}
    }, 250);
  }
  const val = function (k) { return ANSWERS[k] || ""; };

  function keysOf(page) {
    const out = [];
    page.blocks.forEach(function (b) {
      const base = page.id + "." + b.k;
      if (b.t === "num") { for (let i = 1; i <= b.n; i++) out.push(base + "." + i); }
      else if (b.t === "prompt" || b.t === "callout" || b.t === "inline") { out.push(base); }
      else if (b.t === "grid" || b.t === "gridarea") { b.rows.forEach(function (_, i) { out.push(base + "." + i); }); }
      else if (b.t === "wsheet") {
        for (let i = 1; i <= b.n; i++) ["a", "b", "c"].forEach(function (c) { out.push(base + "." + i + c); });
      } else if (b.t === "tri") { TRI_FIELDS.forEach(function (f) { out.push(base + "." + f[0]); }); }
    });
    return out;
  }
  function allKeys() {
    let out = [];
    PAGES.forEach(function (p) { out = out.concat(keysOf(p)); });
    return out;
  }

  /* ---------- figures ---------- */

  function svgTriangle(a) {
    const t = function (x, y, k, anchor) {
      if (!a) return "";
      return '<text x="' + x + '" y="' + y + '" text-anchor="' + anchor +
        '" font-family="Poppins, Arial" font-size="26" fill="#1c1c1c">' + esc(a[k] || "") + "</text>";
    };
    return '<svg viewBox="0 0 760 470" role="img" aria-label="Success triangle">' +
      '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>' +
      '<g stroke="#111" stroke-width="5" marker-end="url(#ah)">' +
      '<line x1="288" y1="310" x2="352" y2="160"/>' +
      '<line x1="408" y1="160" x2="472" y2="310"/>' +
      '<line x1="462" y1="350" x2="300" y2="350"/>' +
      "</g>" +
      '<circle cx="380" cy="110" r="44" fill="#0b4ea2"/>' +
      '<circle cx="250" cy="350" r="44" fill="#0b4ea2"/>' +
      '<circle cx="510" cy="350" r="44" fill="#0b4ea2"/>' +
      t(380, 42, "top", "middle") + t(122, 424, "left", "middle") + t(638, 424, "right", "middle") +
      "</svg>";
  }

  const HATS = ["Trainer", "Coach", "Mentor", "Supervisor"];

  /* ---------- screen rendering ---------- */

  function field(k, ph) {
    return '<input class="f" type="text" data-fk="' + k + '" value="' + esc(val(k)) +
      '" placeholder="' + esc(ph || "") + '" autocomplete="off" spellcheck="true">';
  }
  function area(k, rows, ph) {
    const r = rows || 3;
    return '<textarea class="f" rows="' + r + '" style="min-height:' + (r * 26 + 30) +
      'px" data-fk="' + k + '" placeholder="' + esc(ph || "") + '">' + esc(val(k)) + "</textarea>";
  }

  function blockHTML(page, b) {
    const base = page.id + "." + b.k;

    if (b.t === "num") {
      let li = "";
      for (let i = 1; i <= b.n; i++) {
        li += '<div class="line"><span>' + i + ".)</span>" + field(base + "." + i) + "</div>";
      }
      return '<div class="blk"><h3>' + esc(b.label) + '</h3><div class="lines">' + li + "</div></div>";
    }
    if (b.t === "prompt") {
      return '<div class="blk"><h3>' + esc(b.label) + "</h3>" + area(base, b.rows) + "</div>";
    }
    if (b.t === "inline") {
      return '<div class="blk inline-q"><h3>' + esc(b.label) + "</h3>" + field(base) + "</div>";
    }
    if (b.t === "callout") {
      return '<div class="blk"><div class="callout"><h4>' + esc(b.label) +
        '</h4><div class="inner">' + area(base, 3) + "</div></div></div>";
    }
    if (b.t === "note") {
      return '<div class="blk"><div class="notebox"><p>' + esc(b.text) + "</p></div></div>";
    }
    if (b.t === "hats") {
      return '<div class="blk"><div class="hats">' +
        HATS.map(function (h) { return "<div>" + h + "</div>"; }).join("") + "</div></div>";
    }
    if (b.t === "grid" || b.t === "gridarea") {
      const wide = b.t === "gridarea";
      let rows = "";
      b.rows.forEach(function (label, i) {
        rows += '<div class="row"><div class="lab">' + esc(label) + '</div><div class="cell">' +
          (wide ? area(base + "." + i, 2) : field(base + "." + i)) + "</div></div>";
      });
      return '<div class="blk"><h3>' + esc(b.label) + '</h3><div class="grid">' +
        '<div class="hdr"><div class="lab">' + esc(b.head[0]) + '</div><div class="cell">' +
        esc(b.head[1]) + "</div></div>" + rows + "</div></div>";
    }
    if (b.t === "wsheet") {
      let rows = "";
      for (let i = 1; i <= b.n; i++) {
        rows += '<div class="row"><div class="c1">' + i + "</div>" +
          '<div class="c2">' + field(base + "." + i + "a") + "</div>" +
          '<div class="c3">' + field(base + "." + i + "b") + "</div>" +
          '<div class="c4">' + field(base + "." + i + "c") + "</div></div>";
      }
      return '<div class="blk"><div class="grid wsheet">' +
        '<div class="hdr"><div class="c1"></div><div class="c2">' + esc(WS_COLS[0]) +
        '</div><div class="c3">' + esc(WS_COLS[1]) + '</div><div class="c4">' + esc(WS_COLS[2]) +
        "</div></div>" + rows + "</div></div>";
    }
    if (b.t === "tri") {
      return '<div class="blk"><div class="fig">' + svgTriangle(null) +
        '<div class="ov" style="left:50%;top:1%;width:28%;transform:translateX(-50%)">' + field(base + ".top") + "</div>" +
        '<div class="ov" style="left:0;top:74.5%;width:24%;transform:translateY(-50%)">' + field(base + ".left") + "</div>" +
        '<div class="ov" style="right:0;top:74.5%;width:24%;transform:translateY(-50%)">' + field(base + ".right") + "</div>" +
        "</div></div>";
    }
    return "";
  }

  function sheetHTML(page) {
    return '<article class="sheet" id="sheet-' + page.id + '">' +
      '<p class="tag">' + esc(page.pg) + " &mdash; " + esc(page.foot) + "</p>" +
      '<p class="quote">' + esc(page.quote) + "</p>" +
      '<div class="blocks">' + page.blocks.map(function (b) { return blockHTML(page, b); }).join("") +
      "</div></article>";
  }

  /* ---------- print sheets ---------- */

  function pTextBox(v) { return '<div class="ptext">' + esc(v) + "</div>"; }

  function printBlock(page, b) {
    const base = page.id + "." + b.k;

    if (b.t === "num") {
      let li = "";
      for (let i = 1; i <= b.n; i++) {
        li += '<div class="pline"><b>' + i + ".)</b><u>" + esc(val(base + "." + i)) + "</u></div>";
      }
      return "<h3>" + esc(b.label) + "</h3>" + li;
    }
    if (b.t === "prompt") { return "<h3>" + esc(b.label) + "</h3>" + pTextBox(val(base)); }
    if (b.t === "inline") {
      return '<div class="pline" style="margin-top:26px"><b style="width:auto;color:#2e6db4;font-size:17px;font-weight:600">' +
        esc(b.label) + "</b><u>" + esc(val(base)) + "</u></div>";
    }
    if (b.t === "callout") {
      return '<div class="pcall" style="margin-top:26px"><h4>' + esc(b.label) +
        '</h4><div class="pin">' + esc(val(base)) + "</div></div>";
    }
    if (b.t === "note") {
      return '<div class="pcall" style="margin-top:26px"><div class="pin" style="text-align:center;font-weight:600;min-height:0">' +
        esc(b.text) + "</div></div>";
    }
    if (b.t === "hats") {
      return '<div class="phats" style="margin-top:26px">' +
        HATS.map(function (h) { return "<div>" + h + "</div>"; }).join("") + "</div>";
    }
    if (b.t === "grid" || b.t === "gridarea") {
      let rows = "";
      b.rows.forEach(function (label, i) {
        rows += '<tr><td class="lab">' + esc(label) + "</td><td>" +
          (esc(val(base + "." + i)) || "&nbsp;") + "</td></tr>";
      });
      return "<h3>" + esc(b.label) + "</h3><table><tr><th>" + esc(b.head[0]) +
        "</th><th>" + esc(b.head[1]) + "</th></tr>" + rows + "</table>";
    }
    if (b.t === "wsheet") {
      let rows = "";
      for (let i = 1; i <= b.n; i++) {
        rows += '<tr><td class="num">' + i + "</td>" +
          "<td>" + (esc(val(base + "." + i + "a")) || "&nbsp;") + "</td>" +
          "<td>" + (esc(val(base + "." + i + "b")) || "&nbsp;") + "</td>" +
          "<td>" + (esc(val(base + "." + i + "c")) || "&nbsp;") + "</td></tr>";
      }
      return '<table style="margin-top:26px"><tr><th></th><th>' + esc(WS_COLS[0]) +
        "</th><th>" + esc(WS_COLS[1]) + "</th><th>" + esc(WS_COLS[2]) + "</th></tr>" + rows + "</table>";
    }
    if (b.t === "tri") {
      const a = {};
      TRI_FIELDS.forEach(function (f) { a[f[0]] = val(base + "." + f[0]); });
      return '<div class="pfig" style="max-width:560px;margin:20px auto 0">' + svgTriangle(a) + "</div>";
    }
    return "";
  }

  function printSheet(page) {
    const d = document.createElement("div");
    d.className = "psheet";
    d.innerHTML =
      '<div class="pmark" style="background:url(' + LOGO_DARK + ') left center / contain no-repeat"></div>' +
      '<p class="pq">' + esc(page.quote) + "</p>" +
      page.blocks.map(function (b) { return printBlock(page, b); }).join("") +
      '<p class="pfoot">' + esc(page.pg) + " &mdash; " + esc(page.foot) + "</p>";
    return d;
  }

  /* ---------- PDF ---------- */

  let libs = null;
  function loadLibs() {
    if (libs) return libs;
    libs = new Promise(function (res, rej) {
      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      ];
      let i = 0;
      (function nextScript() {
        if (i === urls.length) return res(true);
        const s = document.createElement("script");
        s.src = urls[i++];
        s.onload = nextScript;
        s.onerror = function () { rej(new Error("offline")); };
        document.head.appendChild(s);
      })();
    });
    return libs;
  }

  /* html2canvas often hands back blank rows at the bottom; left in, they
     turn into an empty continuation page. */
  function trimBottom(canvas) {
    try {
      const ctx = canvas.getContext("2d");
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let last = -1;
      for (let y = canvas.height - 1; y >= 0 && last < 0; y--) {
        const row = y * canvas.width * 4;
        for (let x = 0; x < canvas.width; x++) {
          const p = row + x * 4;
          if (d[p] < 248 || d[p + 1] < 248 || d[p + 2] < 248) { last = y; break; }
        }
      }
      const keep = Math.min(canvas.height, (last < 0 ? 0 : last) + 40);
      if (keep > 0 && keep < canvas.height) {
        const c = document.createElement("canvas");
        c.width = canvas.width; c.height = keep;
        const cx = c.getContext("2d");
        cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(canvas, 0, 0);
        canvas.height = keep;
        ctx.drawImage(c, 0, 0);
      }
    } catch (e) { /* tainted canvas or out of memory — keep the full height */ }
  }

  async function makePDF() {
    const btn = $("dlbtn"), hint = $("dlhint");
    btn.disabled = true;
    hint.textContent = "Building your PDF…";
    try {
      await loadLibs();
      const root = $("printroot");
      root.innerHTML = "";
      const nodes = PAGES.map(function (p) { const n = printSheet(p); root.appendChild(n); return n; });

      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
      await new Promise(function (r) { setTimeout(r, 120); });

      const doc = new window.jspdf.jsPDF({ unit: "pt", format: "letter", compress: true });
      const M = 30, PW = 612, PH = 792, W = PW - M * 2, H = PH - M * 2;

      for (let i = 0; i < nodes.length; i++) {
        hint.textContent = "Building your PDF… page " + (i + 1) + " of " + nodes.length;
        const canvas = await window.html2canvas(nodes[i], {
          scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true, imageTimeout: 0
        });
        trimBottom(canvas);
        const ratio = canvas.width / W;
        const fullH = canvas.height / ratio;

        if (fullH <= H) {
          if (i) doc.addPage();
          doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M, M, W, fullH);
        } else if (fullH <= H * 1.3) {
          const h = H, w = W * (H / fullH);
          if (i) doc.addPage();
          doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (W - w) / 2, M, w, h);
        } else {
          const sliceH = Math.floor(H * ratio);
          let y = 0, first = true;
          while (y < canvas.height) {
            const h = Math.min(sliceH, canvas.height - y);
            const c = document.createElement("canvas");
            c.width = canvas.width; c.height = h;
            const cx = c.getContext("2d");
            cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, c.width, c.height);
            cx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
            if (i || !first) doc.addPage();
            doc.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", M, M, W, h / ratio);
            first = false;
            y += h;
          }
        }
      }

      doc.save("4 Hats of Leadership - Workbook.pdf");
      root.innerHTML = "";
      hint.textContent = "";
      refresh();
    } catch (e) {
      hint.textContent = "The PDF builder couldn't load. Check your connection and try again.";
    }
    btn.disabled = false;
  }

  /* ---------- page ---------- */

  function grow(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }

  function refresh() {
    const ks = allKeys();
    const left = ks.filter(function (k) { return !(ANSWERS[k] || "").trim(); }).length;
    $("dlhint").textContent = left ? left + " of " + ks.length + " left to fill in." : "";
  }

  function start(info) {
    loadAnswers();

    $("title").textContent = info.title;
    document.title = info.title + " — Lushin / Sandler";
    $("stage").innerHTML =
      '<iframe src="https://www.youtube-nocookie.com/embed/' + info.video + '?rel=0" ' +
      'title="' + esc(info.title) + '" allowfullscreen ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';

    $("sheets").innerHTML = PAGES.map(sheetHTML).join("");
    $("sheets").querySelectorAll("textarea.f").forEach(grow);

    document.addEventListener("input", function (e) {
      const el = e.target;
      if (!el || !el.dataset || !el.dataset.fk) return;
      ANSWERS[el.dataset.fk] = el.value;
      saveAnswers();
      if (el.tagName === "TEXTAREA") grow(el);
      refresh();
    });

    $("dlbtn").addEventListener("click", makePDF);

    $("gate").classList.remove("on");
    $("session").classList.add("on");
    $("logo").hidden = false;
    document.body.classList.remove("booting");
    refresh();
  }

  /* ---------- the gate ---------- */

  function bytes(b64s) {
    const bin = atob(b64s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function remember(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function recall()    { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function forget()    { try { localStorage.removeItem(STORE); } catch (e) {} }

  async function unlock(password) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(VAULT.salt), iterations: VAULT.iters, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(VAULT.iv) }, key, bytes(VAULT.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function askForPassword(message) {
    document.body.classList.remove("booting");
    $("gate").classList.add("on");
    $("note").textContent = message || "";
    $("pw").value = "";
    setTimeout(function () { $("pw").focus(); }, 60);
  }

  $("entry").addEventListener("submit", async function (e) {
    e.preventDefault();
    const value = $("pw").value.trim();
    if (!value) return;
    $("go").disabled = true;
    $("note").textContent = "Checking…";
    $("gate").classList.remove("bad");
    try {
      const info = await unlock(value);
      remember(value);
      start(info);
    } catch (err) {
      $("gate").classList.add("bad");
      $("note").textContent = "That password didn't work.";
      $("go").disabled = false;
      $("pw").select();
    }
  });

  (async function boot() {
    if (!window.crypto || !crypto.subtle) {
      askForPassword("Open this page over https to unlock it.");
      $("go").disabled = true;
      return;
    }
    if (location.hash === "#lock") {
      forget();
      history.replaceState(null, "", location.pathname + location.search);
      askForPassword("");
      return;
    }
    const saved = recall();
    if (!saved) return askForPassword("");
    try { start(await unlock(saved)); }
    catch (err) { forget(); askForPassword(""); }
  })();
})();
</script>
</body>
